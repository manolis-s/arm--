<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armέξ - Σύνδεση</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2196F3; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background-color: #1976D2; }
        button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        #message { margin-top: 15px; font-weight: bold; }
        .error { color: red; }
        a { display: block; margin-top: 15px; color: #555; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Σύνδεση</h2>
    <p>Καλώς ήρθες</p>
    <form id="login-form">
        <input type="text" id="username" placeholder="Όνομα χρήστη" required>
        <input type="password" id="password" placeholder="Κωδικός" required>
        <button type="submit" id="login-btn">Eίσοδος</button> 
    </form>
    <div id="message"></div>
    <a href="./register.html">Δεν έχεις λογαριασμό; Εγγραφή</a>

    <script scr="login.js" defer></script>
</body>
