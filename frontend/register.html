<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Armέξ - Εγγραφή</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        #message { margin-top: 15px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
        a { display: block; margin-top: 15px; color: #555; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Νέος Φαντάρος</h2>
        <p>Φτιάξε τον λογαριασμό σου</p>
        <form id="register-form">
            <input type="text" id="username" placeholder="Όνομα Χρήστη" required autocomplete="off">
            <input type="password" id="password" placeholder="Κωδικός" required autocomplete="off">
            <label for="discharge-date" style="display: block; font-weight: bold; color: #2c3e50; margin-bottom: 5px;">
                📅 Ημερομηνία Απόλυσης ΝΕΟΣ:
            </label>
            <input type="date" id="discharge-date" required>
            <button type="submit" id="register-btn">Εγγραφή</button>
        </form>
        <div id="message"></div>
        <a href="login.html">Ήδη έχεις λογαριασμό; Σύνδεση</a>
    </div>

    <script src="register.js" defer></script>
</body>
